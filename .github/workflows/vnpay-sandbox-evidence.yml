name: Bounded VNPay Sandbox Evidence

on:
  workflow_dispatch:
    inputs:
      order_id:
        description: Exact sandbox UAT order UUID
        required: true
        type: string
      mode:
        description: Inspect/reconcile one order or read migration guard metadata
        required: true
        type: choice
        options: [inspect, reconcile, migration]
        default: inspect
      expected_sha:
        description: Exact deployed backend commit (40 lowercase hex characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: eduai-backend-production
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Inspect bounded sandbox evidence over established SSH
        env:
          ORDER_ID: ${{ inputs.order_id }}
          MODE: ${{ inputs.mode }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ "$ORDER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]
          [[ "$MODE" == inspect || "$MODE" == reconcile || "$MODE" == migration ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$MODE" != migration ]]; then
            [[ "$EXPECTED_SHA" == "$WORKFLOW_SHA" ]]
          fi
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/eduai_deploy
          chmod 600 ~/.ssh/eduai_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/eduai_deploy ~/.ssh/known_hosts' EXIT
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/eduai_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "ORDER_ID='$ORDER_ID' MODE='$MODE' EXPECTED_SHA='$EXPECTED_SHA' bash -s" << 'EOF'
          set -Eeuo pipefail
          exec 9>/tmp/eduai-backend-deploy.lock
          flock -w 30 9
          cd /var/www/eduai/backend
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [ "$MODE" = migration ]; then
            git diff --quiet -- scripts/run-production-migrations.cjs
            timeout --signal=TERM --kill-after=10s 90s node <<'NODE'
          const { Client } = require('pg');
          const runtimeEnv = require('dotenv').parse(require('node:fs').readFileSync('.env'));
          console.log(JSON.stringify({ runtimePaymentConfiguration: {
            defaultProvider: ['payos', 'vnpay', 'disabled'].includes(runtimeEnv.PAYMENT_DEFAULT_PROVIDER) ? runtimeEnv.PAYMENT_DEFAULT_PROVIDER : 'unknown',
            vnpayEnvironment: ['disabled', 'sandbox', 'production'].includes(runtimeEnv.VNPAY_ENVIRONMENT) ? runtimeEnv.VNPAY_ENVIRONMENT : 'unknown',
            payosEnvironment: ['disabled', 'production'].includes(runtimeEnv.PAYOS_ENVIRONMENT) ? runtimeEnv.PAYOS_ENVIRONMENT : 'unknown',
          } }));
          const guards = require('./scripts/run-production-migrations.cjs');
          const connectionString = guards.loadMigrationDatabaseUrl(process.cwd());
          const client = new Client(guards.buildDatabaseClientConfig(connectionString, 'eduai-readonly-migration-diagnostic'));
          (async () => {
            try {
              await client.connect();
              await client.query('BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY');
              await client.query('SET LOCAL search_path = public, pg_catalog');
              for (const [name, query] of [
                ['schema', guards.RECONCILIATION_SCHEMA_QUERY],
                ['cases', guards.RECONCILIATION_CASE_STATE_QUERY],
                ['markers', guards.RECONCILIATION_MARKER_QUERY],
                ['financialCounts', guards.RECONCILIATION_FINANCIAL_DIGEST_QUERY],
              ]) {
                const result = await client.query(query);
                if (result.rowCount !== 1) throw new Error('Incomplete diagnostic');
                const row = result.rows[0];
                const metadata = name === 'financialCounts'
                  ? Object.fromEntries(Object.entries(row.digests).map(([key, value]) => [key, value.rowCount]))
                  : row;
                if (Object.values(metadata).some((value) => typeof value !== 'boolean' && !/^\d+$/.test(String(value)))) throw new Error('Non-metadata diagnostic');
                console.log(JSON.stringify({ migrationDiagnostic: name, metadata }));
              }
              await client.query('ROLLBACK');
            } finally { await client.end(); }
          })().catch(() => { console.error('Read-only migration diagnostic failed'); process.exitCode = 1; });
          NODE
            exit
          fi
          git diff --quiet -- scripts/vnpay-sandbox-evidence.cjs
          test -f dist/src/modules/payments/payment-reconciliation.service.js
          timeout --signal=TERM --kill-after=10s 90s \
            node scripts/vnpay-sandbox-evidence.cjs "$ORDER_ID" "$MODE" "$EXPECTED_SHA"
          EOF
