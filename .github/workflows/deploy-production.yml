name: Deploy Backend Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: eduai-backend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      PORT: "3010"

      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eduai
      REDIS_URL: redis://127.0.0.1:6379

      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long

      PUBLIC_APP_URL: http://localhost:5173

      FIREBASE_PROJECT_ID: ""
      FIREBASE_CLIENT_EMAIL: ""
      FIREBASE_PRIVATE_KEY: ""

      R2_ACCOUNT_ID: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_BUCKET_NAME: ""
      R2_PUBLIC_URL: ""

      AI_PROVIDER: mock
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-4.1-mini
      OPENAI_EMBEDDING_MODEL: text-embedding-3-small

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Build backend
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci
    environment: production

    outputs:
      deploy_start: ${{ steps.deploy_start.outputs.timestamp }}

    steps:
      - name: Record deploy start time
        id: deploy_start
        run: echo "timestamp=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          test -n "$VPS_SSH_KEY" || {
            echo "ERROR: VPS_SSH_KEY is missing"
            exit 1
          }

          test -n "$VPS_KNOWN_HOSTS" || {
            echo "ERROR: VPS_KNOWN_HOSTS is missing"
            exit 1
          }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/eduai_deploy
          chmod 600 ~/.ssh/eduai_deploy

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/eduai_deploy \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "echo 'SSH connection successful'"

      - name: Deploy backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/eduai_deploy \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" << 'EOF'
          set -Eeuo pipefail

          exec 9>/tmp/eduai-backend-deploy.lock

          flock -w 120 9 || {
            echo "Another backend deployment remained active after 120 seconds."
            exit 1
          }

          cd /var/www/eduai/backend

          pm2 logs eduai-backend --lines 300 --nostream 2>&1 | node -e '
            let log = "";
            process.stdin.on("data", (chunk) => { log += chunk; });
            process.stdin.on("end", () => {
              const failureClass = /failureClass[": ]+ASSIGNMENT_VERSION_CONFLICT/i.test(log)
                ? "ASSIGNMENT_VERSION_CONFLICT"
                : /failureClass[": ]+AUTH_REFRESH_TOKEN_CONFLICT/i.test(log)
                  ? "AUTH_REFRESH_TOKEN_CONFLICT"
                  : /failureClass[": ]+CERTIFICATE_UNIQUE_CONFLICT/i.test(log)
                    ? "CERTIFICATE_UNIQUE_CONFLICT"
                    : /failureClass[": ]+AUDIT_LOG_UNIQUE_CONFLICT/i.test(log)
                      ? "AUDIT_LOG_UNIQUE_CONFLICT"
                      : /failureClass[": ]+OTHER_UNIQUE_CONSTRAINT_CONFLICT/i.test(log)
                        ? "OTHER_UNIQUE_CONSTRAINT_CONFLICT"
              : /P2021|table .* does not exist/i.test(log)
                ? "ASSIGNMENT_SCHEMA_TABLE_MISSING"
                : /P2022|column .* does not exist/i.test(log)
                  ? "ASSIGNMENT_SCHEMA_COLUMN_MISSING"
                  : /P2002[\s\S]{0,1000}(?:submissions|submission)|(?:submissions|submission)[\s\S]{0,1000}P2002/i.test(log)
                    ? "ASSIGNMENT_VERSION_CONFLICT"
                    : /P2002[\s\S]{0,500}certificate|certificate[\s\S]{0,500}P2002/i.test(log)
                      ? "DOWNSTREAM_CERTIFICATE_CONFLICT"
                      : /P2002[\s\S]{0,500}enrollment|enrollment[\s\S]{0,500}P2002/i.test(log)
                        ? "DOWNSTREAM_ENROLLMENT_CONFLICT"
                        : /P2002|unique constraint/i.test(log)
                          ? (/refresh_token|refreshToken/i.test(log)
                            ? "AUTH_REFRESH_TOKEN_CONFLICT"
                            : /audit_log|auditLog/i.test(log)
                              ? "AUDIT_LOG_CONFLICT"
                              : "OTHER_UNIQUE_CONSTRAINT_CONFLICT")
                    : /R2 storage is not configured|CredentialsProviderError|SignatureDoesNotMatch|NoSuchBucket/i.test(log)
                      ? "ASSIGNMENT_R2_CONFIGURATION_FAILED"
                      : /Transaction.*(?:closed|expired|timeout)|P2028/i.test(log)
                        ? "ASSIGNMENT_TRANSACTION_FAILED"
                        : /ForbiddenException|UnauthorizedException/i.test(log)
                          ? "ASSIGNMENT_AUTHORIZATION_FAILED"
                          : /BadRequestException|ValidationPipe/i.test(log)
                            ? "ASSIGNMENT_DTO_VALIDATION_FAILED"
                            : /assignments\.service|AssignmentsService|submitAssignment/i.test(log)
                              ? "ASSIGNMENT_APPLICATION_ERROR"
                              : "NO_CLASSIFIED_ASSIGNMENT_ERROR";
              console.log(`preRestartAssignmentFailureClass: ${failureClass}`);
            });
          '

          echo "Fetching source..."
          source_fetched=false
          for attempt in 1 2 3; do
            if git \
              -c http.connectTimeout=20 \
              -c http.lowSpeedLimit=1 \
              -c http.lowSpeedTime=30 \
              fetch origin main; then
              source_fetched=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Source fetch attempt ${attempt} failed; retrying."
              sleep 5
            fi
          done
          if [ "$source_fetched" != true ]; then
            echo "deploymentFailureClass: SOURCE_FETCH_FAILED"
            exit 1
          fi
          git reset --hard origin/main

          if [ ! -f .env ]; then
            echo "ERROR: /var/www/eduai/backend/.env does not exist"
            exit 1
          fi

          echo "Verifying notification email configuration..."
          node -e '
            require("dotenv").config({ quiet: true });
            const provider = process.env.EMAIL_PROVIDER;
            const senderConfigured = Boolean(process.env.EMAIL_FROM?.trim());
            const apiKeyConfigured = Boolean(process.env.RESEND_API_KEY?.trim());
            console.log(`notificationEmailProvider: ${provider === "resend" ? "resend" : "invalid"}`);
            console.log(`notificationEmailSenderConfigured: ${senderConfigured}`);
            console.log(`notificationEmailApiKeyConfigured: ${apiKeyConfigured}`);
            if (provider !== "resend" || !senderConfigured || !apiKeyConfigured) {
              console.error("ERROR: production notification email configuration is incomplete");
              process.exit(1);
            }
          '

          echo "Installing dependencies..."
          npm ci

          echo "Verifying permanent Commerce configuration..."
          npm run config:verify:production-commerce

          echo "Generating Prisma client..."
          npm run prisma:generate

          echo "Validating Prisma schema..."
          npm run prisma:validate

          echo "Applying database migrations with isolated role..."
          npm run prisma:migrate:production

          echo "Verifying least-privilege runtime database role..."
          npm run db:verify:production-runtime-role

          echo "Building backend..."
          npm run build

          echo "Restarting PM2..."
          pm2 restart eduai-backend --update-env
          pm2 save

          BACKEND_PORT="$(node -e '
            require("dotenv").config({ quiet: true });
            const port = Number(process.env.PORT || 3000);
            if (!Number.isInteger(port) || port < 1 || port > 65535) process.exit(1);
            process.stdout.write(String(port));
          ')"

          echo "Waiting for backend readiness..."
          for attempt in {1..12}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 5 \
              "http://127.0.0.1:${BACKEND_PORT}/api/docs" \
              > /dev/null; then
              break
            fi

            if [ "$attempt" -eq 12 ]; then
              echo "ERROR: Backend readiness check timed out"
              pm2 jlist | node -e '
                let input = "";
                process.stdin.on("data", (chunk) => { input += chunk; });
                process.stdin.on("end", () => {
                  const processInfo = JSON.parse(input).find((item) => item.name === "eduai-backend");
                  if (!processInfo) {
                    console.log("pm2Status: NOT_FOUND");
                    return;
                  }
                  const uptimeSeconds = processInfo.pm2_env.pm_uptime
                    ? Math.max(0, Math.floor((Date.now() - processInfo.pm2_env.pm_uptime) / 1000))
                    : 0;
                  console.log(`pm2Status: ${processInfo.pm2_env.status || "unknown"}`);
                  console.log(`pm2RestartCount: ${processInfo.pm2_env.restart_time || 0}`);
                  console.log(`pm2UptimeSeconds: ${uptimeSeconds}`);
                });
              '
              if ss -ltn "sport = :${BACKEND_PORT}" | tail -n +2 | grep -q .; then
                echo "expectedPortListening: true"
              else
                echo "expectedPortListening: false"
              fi
              pm2 logs eduai-backend --err --lines 100 --nostream 2>&1 | node -e '
                let log = "";
                process.stdin.on("data", (chunk) => { log += chunk; });
                process.stdin.on("end", () => {
                  const failureClass = /circular dependency.*property key: \"fileUrl\"/i.test(log)
                    ? "SWAGGER_SCHEMA_GENERATION_FAILED"
                    : /EADDRINUSE/.test(log)
                    ? "PORT_BIND_FAILED"
                    : /Cannot find module|MODULE_NOT_FOUND/.test(log)
                      ? "MODULE_LOAD_FAILED"
                      : /P1001|ECONNREFUSED.*(?:postgres|database)|database.*unreachable/i.test(log)
                        ? "DATABASE_CONNECTION_FAILED"
                        : /environment|configuration|config validation|missing required/i.test(log)
                          ? "ENV_CONFIG_INVALID"
                          : /SyntaxError|TypeError|ReferenceError/.test(log)
                            ? "APPLICATION_STARTUP_ERROR"
                            : "UNKNOWN_PROCESS_STARTUP_FAILURE";
                  console.log(`deploymentFailureClass: ${failureClass}`);

                  const sanitizedLines = log.split(/\r?\n/)
                    .filter((line) => /Error|Exception|WARN|Nest|listen|ready|bootstrap/i.test(line))
                    .map((line) => line
                      .replace(/(?:\/home|\/var|\/opt)\/\S+/gi, "[SERVER_PATH]")
                      .replace(/https?:\/\/\S+/gi, "[URL_REDACTED]")
                      .replace(/\b(?:\d{1,3}\.){3}\d{1,3}\b/g, "[HOST]")
                      .replace(/\b[0-9a-f]{8}-[0-9a-f-]{27,}\b/gi, "[ID]")
                      .replace(/(token|password|secret|key)[=:]\S+/gi, "$1=[REDACTED]"))
                    .slice(-10);
                  console.log("sanitizedStderr:");
                  sanitizedLines.forEach((line) => console.log(line));
                });
              '
              pm2 logs eduai-backend --out --lines 100 --nostream 2>&1 | node -e '
                let log = "";
                process.stdin.on("data", (chunk) => { log += chunk; });
                process.stdin.on("end", () => {
                  const sanitizedLines = log.split(/\r?\n/)
                    .filter((line) => /Error|Exception|WARN|Nest|listen|ready|bootstrap/i.test(line))
                    .map((line) => line
                      .replace(/(?:\/home|\/var|\/opt)\/\S+/gi, "[SERVER_PATH]")
                      .replace(/https?:\/\/\S+/gi, "[URL_REDACTED]")
                      .replace(/\b(?:\d{1,3}\.){3}\d{1,3}\b/g, "[HOST]")
                      .replace(/\b[0-9a-f]{8}-[0-9a-f-]{27,}\b/gi, "[ID]")
                      .replace(/(token|password|secret|key)[=:]\S+/gi, "$1=[REDACTED]"))
                    .slice(-10);
                  console.log("sanitizedStdout:");
                  sanitizedLines.forEach((line) => console.log(line));
                });
              '
              exit 1
            fi

            sleep 5
          done

          pm2 logs eduai-backend --lines 300 --nostream 2>&1 | node -e '
            let log = "";
            process.stdin.on("data", (chunk) => { log += chunk; });
            process.stdin.on("end", () => {
              const failureClass = /P2021|table .* does not exist/i.test(log)
                ? "ASSIGNMENT_SCHEMA_TABLE_MISSING"
                : /P2022|column .* does not exist/i.test(log)
                  ? "ASSIGNMENT_SCHEMA_COLUMN_MISSING"
                  : /P2002|unique constraint/i.test(log)
                    ? "ASSIGNMENT_VERSION_CONFLICT"
                    : /R2 storage is not configured|CredentialsProviderError|SignatureDoesNotMatch|NoSuchBucket/i.test(log)
                      ? "ASSIGNMENT_R2_CONFIGURATION_FAILED"
                      : /Transaction.*(?:closed|expired|timeout)|P2028/i.test(log)
                        ? "ASSIGNMENT_TRANSACTION_FAILED"
                        : /ForbiddenException|UnauthorizedException/i.test(log)
                          ? "ASSIGNMENT_AUTHORIZATION_FAILED"
                          : /BadRequestException|ValidationPipe/i.test(log)
                            ? "ASSIGNMENT_DTO_VALIDATION_FAILED"
                            : /assignments\.service|AssignmentsService|submitAssignment/i.test(log)
                              ? "ASSIGNMENT_APPLICATION_ERROR"
                              : "NO_CLASSIFIED_ASSIGNMENT_ERROR";
              console.log(`recentAssignmentFailureClass: ${failureClass}`);
            });
          '

          echo "Backend deployment completed."
          EOF

      - name: Cleanup SSH files
        if: ${{ always() }}
        run: |
          rm -f ~/.ssh/eduai_deploy
          rm -f ~/.ssh/known_hosts

  notify:
    name: Telegram notification
    runs-on: ubuntu-latest

    needs:
      - ci
      - deploy

    if: ${{ always() }}

    steps:
      - name: Telegram - backend deployment notification
        continue-on-error: true

        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          WORKFLOW: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}

          CI_RESULT: ${{ needs.ci.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOY_START: ${{ needs.deploy.outputs.deploy_start }}

        run: |
          set -Eeuo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets are missing. Skip notification."
            exit 0
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"
          RUN_URL="https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          END_TIME="$(date +%s)"

          if [[ "${DEPLOY_START:-}" =~ ^[0-9]+$ ]]; then
            TOTAL_SECONDS=$((END_TIME - DEPLOY_START))
          else
            TOTAL_SECONDS=0
          fi

          if [ "$TOTAL_SECONDS" -lt 0 ]; then
            TOTAL_SECONDS=0
          fi

          HOURS=$((TOTAL_SECONDS / 3600))
          MINUTES=$(((TOTAL_SECONDS % 3600) / 60))
          SECONDS=$((TOTAL_SECONDS % 60))

          if [ "$HOURS" -gt 0 ]; then
            DEPLOY_TIME="${HOURS}h ${MINUTES}m ${SECONDS}s"
          elif [ "$MINUTES" -gt 0 ]; then
            DEPLOY_TIME="${MINUTES}m ${SECONDS}s"
          elif [ "$TOTAL_SECONDS" -gt 0 ]; then
            DEPLOY_TIME="${SECONDS}s"
          else
            DEPLOY_TIME="Không thực hiện deploy"
          fi

          if [ -z "${COMMIT_MESSAGE:-}" ]; then
            COMMIT_MESSAGE="Chạy workflow thủ công"
          fi

          COMMIT_MESSAGE="$(
            printf '%s' "$COMMIT_MESSAGE" |
            tr '\n\r' ' ' |
            cut -c1-250
          )"

          if [ "$CI_RESULT" != "success" ]; then
            TITLE="❌ EduAI Backend CI Thất Bại"

            RESULT_MESSAGE="$(printf '%s\n' \
              "🔴 CI: ${CI_RESULT^^}" \
              "⚪ Deploy: Không thực hiện" \
              "ℹ️ Backend production không bị thay đổi")"

          elif [ "$DEPLOY_RESULT" = "success" ]; then
            TITLE="⚙️ EduAI Backend Deploy Thành Công"

            RESULT_MESSAGE="$(printf '%s\n' \
              "🟢 CI: PASSED" \
              "🟢 Prisma Migration: SUCCESS" \
              "🟢 Deploy: SUCCESS" \
              "🟢 Health Check: PASSED" \
              "🔗 API Docs: https://api.eduai.giaoducso.org.vn/api/docs")"

          elif [ "$DEPLOY_RESULT" = "cancelled" ]; then
            TITLE="⚠️ EduAI Backend Deploy Đã Bị Hủy"

            RESULT_MESSAGE="$(printf '%s\n' \
              "🟢 CI: PASSED" \
              "🟠 Deploy: CANCELLED" \
              "ℹ️ Kiểm tra PM2 và trạng thái API")"

          elif [ "$DEPLOY_RESULT" = "skipped" ]; then
            TITLE="⚠️ EduAI Backend Deploy Bị Bỏ Qua"

            RESULT_MESSAGE="$(printf '%s\n' \
              "🟢 CI: PASSED" \
              "🟠 Deploy: SKIPPED" \
              "ℹ️ Kiểm tra điều kiện chạy job deploy")"

          else
            TITLE="❌ EduAI Backend Deploy Thất Bại"

            RESULT_MESSAGE="$(printf '%s\n' \
              "🟢 CI: PASSED" \
              "🔴 Deploy: ${DEPLOY_RESULT^^}" \
              "🟡 PM2/API: Kiểm tra log production" \
              "🔗 API Docs: https://api.eduai.giaoducso.org.vn/api/docs")"
          fi

          MESSAGE="$(printf '%s\n' \
            "$TITLE" \
            "" \
            "🌐 Môi trường: Production" \
            "📦 Repository: ${REPOSITORY}" \
            "🌿 Branch: ${BRANCH}" \
            "" \
            "🔖 Commit:" \
            "${SHORT_SHA} - ${COMMIT_MESSAGE}" \
            "" \
            "👤 Người thực hiện: ${ACTOR}" \
            "🚀 Workflow: ${WORKFLOW}" \
            "🔢 Run: #${RUN_NUMBER}" \
            "⏱️ Thời gian deploy: ${DEPLOY_TIME}" \
            "" \
            "${RESULT_MESSAGE}" \
            "" \
            "📋 Chi tiết:" \
            "${RUN_URL}")"

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            > /dev/null

          echo "Telegram notification sent."
