name: Backend CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Test and build backend
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/eduai_ci
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production deployment authorization gate
        run: node --test scripts/production-deployment-gate.test.cjs

      - name: Manual bank transfer security tests
        run: npm test -- --runInBand modules/payments/bank-transfer modules/payments/bank-receipt-access modules/access/course-access.service modules/memberships/service-entitlement modules/memberships/membership-continuity modules/memberships/membership-checkout.service

      - name: Manual bank transfer PostgreSQL invariants
        run: npm run test:demo-data -- --runInBand bank-transfer-migration.spec.ts bank-receipt-migration.spec.ts bank-receipt-access.spec.ts receipt-quota-pool.spec.ts

      - name: Payment security tests
        run: >-
          npm test -- --runInBand
          modules/payments/payment-request.service.spec.ts
          modules/payments/payos-payment.provider.spec.ts
          modules/payments/payment-webhook.service.spec.ts
          modules/payments/payment-webhook.controller.spec.ts
          modules/payments/payment-lifecycle.service.spec.ts
          modules/payments/payment-reconciliation.service.spec.ts
          modules/payments/commerce-fulfillment.service.spec.ts
          modules/payments/payment-recovery-error.spec.ts
          modules/payments/vnpay-payment.provider.spec.ts
          modules/payments/vnpay-querydr.spec.ts
          modules/payments/vnpay-ipn.service.spec.ts
          modules/payments/vnpay-uat-deployment.spec.ts
          config/env.validation.spec.ts
          config/reconciliation-hardening-preflight.spec.ts
          config/production-runtime-role.spec.ts

      - name: Bounded Sandbox evidence safety tests
        run: node --test scripts/vnpay-sandbox-evidence.test.cjs

      - name: Commerce lifecycle PostgreSQL regression
        run: >-
          npm run test:demo-data -- --runInBand
          commerce-lifecycle-multi-transition-postgres.spec.ts

      - name: Audit endpoint authorization
        run: npm run security:audit-endpoints

      - name: Build
        run: npm run build

  bank-transfer-postgres:
    name: Bank transfer concurrent PostgreSQL transactions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: eduai_payw_ci
          POSTGRES_USER: eduai_payw_ci
          POSTGRES_PASSWORD: ci-payw-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduai_payw_ci -d eduai_payw_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-payw-access-only
      JWT_REFRESH_SECRET: ci-payw-refresh-only
      DATABASE_URL: postgresql://eduai_payw_ci:ci-payw-disposable-only@127.0.0.1:5432/eduai_payw_ci
      PAYW_TEST_DATABASE_URL: postgresql://eduai_payw_ci:ci-payw-disposable-only@127.0.0.1:5432/eduai_payw_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Type-check receipt membership fixtures
        run: >-
          npx tsc --allowJs --checkJs --noEmit --target ES2022
          --module Node16 --moduleResolution Node16 --skipLibCheck --experimentalDecorators
          scripts/test-receipt-membership-concurrency.cjs
      - name: Exercise real concurrent payment transactions
        run: node --test scripts/test-bank-transfer-concurrency.cjs
